# 开启非玩家实体套装粒子特效 true(开)/false(关) 不建议开启
OtherEntitySuitEffect: false
# 保护符lore行识别符号，不冲突的情况下勿乱改
PROTECT_RUNE_JUDGE: "§a§l保护符: "
# 属性lore行识别符号，不冲突的情况下勿乱改
LEVEL_JUDGE: "§e§l淬炼属性: "
# 移星界面标题
MoveLevelInvTitle: "§8淬炼移星"
# 套装效果是否判断副手
JudgeOffHand: true
# 淬炼后物品名称格式 0为不显示+等级 1为+等级显示在前 2为+等级显示在后
DisplayNameFormat: 0
# 淬炼后删除包含以下字符串的lore
ReplaceLore: []
#    - "物理伤害"
#    - "魔法伤害"

# ==================== 宝石镶嵌系统配置 ====================
Gem:
  # 是否启用宝石镶嵌系统
  Enable: true
  # 每件装备最多可拥有的宝石槽位数
  MaxSlots: 3
  # 装备默认初始槽位数（0表示必须先使用打孔符开孔）
  DefaultSlots: 1
  # 宝石属性lore行识别前缀（淬炼升级/降级时会自动保留宝石行）
  GEM_JUDGE: "§b§l宝石属性: "
  # 宝石区块分隔线
  UNDER_LINE: "§b§l§m  §3§l§m  §9§l§m  §e§l宝石镶嵌§9§l§m  §3§l§m  §b§l§m  "
  # 空宝石槽位显示文本
  SLOT_EMPTY_LORE: "§7◇ 空宝石槽位"
  # 已镶嵌宝石名称前缀
  SLOT_FILLED_PREFIX: "§b◆ "
  # 宝石镶嵌/打孔GUI标题
  InlayInvTitle: "§8装备宝石镶嵌"
  # 宝石拆卸GUI标题
  RemoveInvTitle: "§8装备宝石拆卸"
  # 淬炼移星时是否保留原装备上的宝石与槽位（true=保留各自宝石，false=不处理）
  KeepGemsOnMoveLevel: true
