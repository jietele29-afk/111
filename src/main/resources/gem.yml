# ==================== 宝石辅助道具配置 ====================
Tools:
  BinderItem:
    Name: "§d§l宝石粘合剂"
    Type: SLIME_BALL
    CustomModelData: 0
    Chance: 100.0
    NeedAmount: 5
    Lore:
      - "§e用法：§a左键拿起粘合剂，直接右键点击背包内的宝石"
      - "§e作用：§a消耗 5 颗同级宝石，粘合升级为 1 颗下一级宝石"
      - "§e最高等级：§b五级宝石"
  RemoveItem:
    Name: "§b§l宝石拆卸符"
    Type: SHEARS
    CustomModelData: 0
    Lore:
      - "§e用法：§a左键拿起拆卸符，右键点击已镶嵌宝石的装备（或 /cuilian gem remove）"
      - "§e作用：§a将装备上已镶嵌的宝石完好取回背包"

